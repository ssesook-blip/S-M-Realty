name: Update Listings

on:
on:
  schedule:
    - cron: '0 12 * * *'  # daily at 12:00 UTC (8:00 AM Dominican Republic time)
  workflow_dispatch:      # lets you trigger it manually from the Actions tab too
    inputs:
      full_rebuild:
        description: 'Regenerate every listing (check this after a design/data change)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

- name: Run pipeline
        env:
          AETOKEN: ${{ secrets.AETOKEN }}
          FULL_REBUILD: ${{ github.event.inputs.full_rebuild }}
        run: python pipeline/update_site.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "sm-realty-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Auto-update listings ($(date +'%Y-%m-%d'))"
          git push
